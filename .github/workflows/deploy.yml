# Runs the tests, then updates the live CRM on Fly.io.
# Runs when changes reach the main branch, or from the Actions tab ("Run workflow").
# Needs (in GitHub → Settings → Secrets and variables → Actions):
#   secret   FLY_API_TOKEN  – from: fly tokens create deploy --app YOUR-APP-NAME
#   variable FLY_APP_NAME   – your Fly app's name
name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    if: ${{ vars.FLY_APP_NAME != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --app "${{ vars.FLY_APP_NAME }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
