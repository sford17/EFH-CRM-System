# Fly.io settings for the CRM: Sydney, always on, data kept on a volume.
# The app name is set when deploying (--app), so this file works for any name.

primary_region = "syd"

[env]
  COOKIE_SECURE = "true"   # sign-in cookie only over https
  TRUST_PROXY = "true"     # Fly's proxy handles https in front of the CRM

[http_service]
  internal_port = 8080
  force_https = true
  # Always running, so scheduled jobs (newsletters, reminders, backups) happen on time.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[mounts]]
  source = "crm_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
